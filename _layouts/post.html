<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Posts live on the homepage timeline; a post's own address opens it there -->
  {% capture target %}{{ '/' | relative_url }}#{{ page.title | slugify }}{% endcapture %}
  <meta charset="utf-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="robots" content="noindex">
  <script>location.replace({{ target | jsonify }});</script>
  <meta http-equiv="refresh" content="0; url={{ target }}">
</head>
<body>
  <p>This post now lives on the <a href="{{ target }}">timeline</a>.</p>
</body>
</html>
