# Everything on the homepage profiler (_includes/profiler.html) except the blog, which comes from _posts.
# Dates are "YYYY-MM" (quoted); leave `to` out for something still going.
# Jobs and art sets share the Experience track; `id` keeps two same-named entries' links apart.
# Project and art write-ups and images live in site-content.js, by id.
#
# A job's `zones` nest like a profiler's: each is a project id from site-content.js, or an entry with
# a name or id, optional from/to, hue, description (HTML), link (a GitHub repo's README is shown with it),
# images: [{ src, caption }], video (YouTube URL), media: pending (keeps a space for media to come, unless
# there's a README to show it), and its
# own `zones`. Undated zones share their parent's time evenly, in the order listed; overlapping ones stack,
# each in the highest row free, in the order listed.
# A job's `events` (releases, promotions) are markers on the Events track: name, date, note (optional),
# images: [{ src, caption }] (optional; shown in the event's window, and in Resources).

career:
  - name: Sledgehammer Games
    role: QA, then Associate Technical Artist, then Technical Artist
    detail: "Call of Duty: Advanced Warfare, WWII, Cold War"
    from: "2014-01"
    to: "2019-05"
    hue: 45
    events:
      - { name: Promoted to Associate Technical Artist, date: "2014-06", note: From Quality Assurance. }
      - { name: "Call of Duty: Advanced Warfare released", date: "2014-11" }
      - { name: Promoted to Technical Artist, date: "2017-04", note: From Associate Technical Artist. }
      - { name: "Call of Duty: WWII released", date: "2017-11" }
    zones:
      - { name: Quality Assurance, from: "2014-01", to: "2014-05" }
      - name: VFX Technical Artist
        from: "2014-06"
        to: "2015-12"
        description: >-
          <p>Owned the destructible and dynamic prop authoring process, delivering hundreds of props that
          integrated VFX, audio, physics, collision, rigging and scripting into grounded and fun in-game systems.</p>
      - id: project-perf-ownership
        from: "2016-01"
        to: "2019-05"
        zones: [project-lod-pipeline, project-edge-cleanup]
  - name: Apple
    role: Technical Artist (contract)
    detail: Synthetic data for Apple Vision Pro
    from: "2019-04"
    to: "2020-08"
    hue: 220
    zones: [project-asset-qa, project-proc-scene, project-outsourcing-pipeline]
  - name: Meta Reality Labs
    role: Technical Artist, then Senior Technical Artist (IC5)
    detail: Horizon Worlds (VR)
    from: "2020-09"
    to: "2023-09"
    hue: 265
    events:
      - { name: Horizon Worlds launched, date: "2021-12", note: Opened to everyone 18+ in the US and Canada. }
      - { name: Promoted to IC5, date: "2022-08" }
    zones:
      - name: Performance Ownership
        id: meta-perf-ownership
        from: "2020-09"
        to: "2023-09"
        description: >-
          <p>My primary role at Meta Reality Labs was to look at performance as a problem holistically. This
          included deep dives with profiling, direct fixes, instrumentation, performance test automation,
          emergency triage, education initiatives, cross-functional outreach, and a ton of other tangential
          and one-off tasks!</p>
        zones: [project-perf-framework, project-perf-dashboards, project-code-fixes]
  - name: Career Break
    from: "2023-10"
    hue: 205
    events:
      - name: Son born
        date: "2024-09"
        images: []  # e.g. [{ src: /resources/son.jpg, caption: Our son }]
      - name: Daughter born
        date: "2026-04"
        images: []
    zones:
      - name: Unannounced UE5 Game
        id: ue5-game-2024
        from: "2024-03"
        to: "2025-08"
        hue: 175
        description: <p>Unreal Engine 5.</p>
      - name: Unity 2D Games
        id: 2d-games
        from: "2026-01"
        to: "2026-06"
        hue: 190
        link: https://github.com/michael-kato/2d_games
        description: >-
          <p>Small 2D games made in Unity to learn its 2D tools, with a focus on juice: dynamic, interactive
          feedback on every action. <a href="#unity-2d-game">Read the blog post</a>.</p>
      - name: Unannounced UE5 Game
        id: ue5-game-2026
        from: "2026-09"
        hue: 175
        description: <p>Unreal Engine 5.</p>
      - name: simkit
        from: "2026-10"
        to: "2026-10"
        hue: 190
        link: https://github.com/michael-kato/simkit
        description: >-
          <p>Engine-agnostic synthetic data tooling for robotics: describe a scenario once, render it in any engine,
          get the same dataset format and ROS 2 interface every time.</p>
      - name: cat3d
        from: "2026-10"
        to: "2026-10"
        hue: 190
        link: https://github.com/michael-kato/cat3d
        description: <p>Renames 3D model files by what they look like, using Blender renders and a local vision model.</p>
